<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>ATLAS — الطائر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0e1a; color:#e8eef5;
    font-family:'Cairo', Tahoma, sans-serif;
    touch-action:none;
  }
  #game { position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:none; }

  /* ========== HUD ========== */
  #hud {
    position:absolute; top:0; left:0; right:0;
    padding:14px 18px; pointer-events:none; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  #brand {
    font-family:'Orbitron', sans-serif;
    font-size:26px; font-weight:900;
    letter-spacing:4px; line-height:1;
    background:linear-gradient(180deg, #fff5b8 0%, #f5c518 45%, #d4a017 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 10px rgba(245,197,24,0.6)) drop-shadow(0 0 20px rgba(245,197,24,0.35));
    animation:brandPulse 3s ease-in-out infinite;
  }
  #brand small {
    display:block; font-family:'Cairo', sans-serif;
    font-size:11px; font-weight:700; letter-spacing:8px;
    color:#7a9cc4; margin-top:4px; text-align:right;
    -webkit-text-fill-color:#7a9cc4;
  }
  @keyframes brandPulse {
    0%,100% { filter:drop-shadow(0 0 8px rgba(245,197,24,0.5)) drop-shadow(0 0 16px rgba(245,197,24,0.25)); }
    50%     { filter:drop-shadow(0 0 14px rgba(245,197,24,0.85)) drop-shadow(0 0 28px rgba(245,197,24,0.5)); }
  }
  #bestBadge {
    background:rgba(245,197,24,0.08);
    border:1px solid rgba(245,197,24,0.35);
    border-radius:12px; padding:6px 13px;
    text-align:center; min-width:64px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  #bestBadge .lbl { display:block; font-size:9px; color:#c8b26a; letter-spacing:1.5px; font-weight:700; }
  #bestBadge .val { display:block; font-size:20px; color:#fff; font-weight:900; font-family:'Orbitron', sans-serif; margin-top:1px; }

  /* ========== Overlays ========== */
  .overlay {
    position:absolute; inset:0;
    display:none; flex-direction:column;
    justify-content:center; align-items:center;
    background:radial-gradient(circle at 50% 40%, rgba(14,26,43,0.88), rgba(5,10,18,0.98));
    z-index:10; padding:24px; text-align:center; overflow-y:auto;
  }
  .overlay.show { display:flex; }

  .title-brand {
    font-family:'Orbitron', sans-serif;
    font-size:64px; font-weight:900; letter-spacing:8px;
    line-height:1; margin-bottom:8px;
    background:linear-gradient(180deg, #fff5b8 0%, #f5c518 50%, #d4a017 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px rgba(245,197,24,0.7)) drop-shadow(0 0 32px rgba(245,197,24,0.4));
    animation:brandPulse 3s ease-in-out infinite;
  }
  .title-sub {
    font-family:'Cairo', sans-serif;
    font-size:16px; color:#7a9cc4; letter-spacing:12px;
    margin-bottom:40px; font-weight:700;
  }

  .btn {
    font-family:'Cairo', sans-serif;
    padding:16px 52px; font-size:19px; font-weight:800;
    background:linear-gradient(180deg, #f5c518, #d4a017);
    color:#1a1a1a; border:none; border-radius:16px;
    cursor:pointer; position:relative;
    box-shadow:0 6px 0 #8b6f0f, 0 8px 24px rgba(245,197,24,0.35);
    transition:transform 0.1s, box-shadow 0.1s;
    margin:6px 0; letter-spacing:0.5px;
    overflow:hidden;
  }
  .btn::before {
    content:''; position:absolute; top:0; left:-100%;
    width:100%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition:left 0.6s;
  }
  .btn:hover::before { left:100%; }
  .btn:active {
    transform:translateY(5px);
    box-shadow:0 1px 0 #8b6f0f, 0 3px 12px rgba(245,197,24,0.25);
  }
  .btn.secondary {
    background:linear-gradient(180deg, #3b82f6, #1d4ed8);
    box-shadow:0 6px 0 #0c2d6b, 0 8px 24px rgba(59,130,246,0.35);
    color:#fff;
  }

  .final-title {
    font-family:'Reem Kufi', sans-serif;
    font-size:30px; font-weight:700; color:#e94560;
    letter-spacing:1px; margin-bottom:12px;
    text-shadow:0 0 16px rgba(233,69,96,0.5);
  }
  .final-block {
    display:flex; gap:40px; margin:12px 0 28px;
    align-items:center; justify-content:center;
  }
  .final-block .item { text-align:center; }
  .final-block .lbl {
    font-size:11px; color:#7a9cc4; font-weight:700;
    letter-spacing:3px; margin-bottom:6px;
  }
  .final-block .val {
    font-family:'Orbitron', sans-serif;
    font-size:52px; font-weight:900; color:#f5c518;
    line-height:1; filter:drop-shadow(0 0 18px rgba(245,197,24,0.6));
  }
  .final-block .val.small {
    font-size:32px; color:#4ade80;
    filter:drop-shadow(0 0 14px rgba(74,222,128,0.5));
  }
  .new-record {
    font-family:'Cairo', sans-serif;
    font-size:14px; font-weight:800; color:#4ade80;
    letter-spacing:2px; margin-top:-8px; margin-bottom:12px;
    animation:recordBlink 1s ease-in-out infinite;
  }
  @keyframes recordBlink {
    0%,100% { opacity:1; }
    50% { opacity:0.4; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="brand">ATLAS<small>الـطـائـر</small></div>
  <div id="bestBadge"><span class="lbl">أفضل</span><span class="val" id="bestVal">0</span></div>
</div>

<div class="overlay show" id="startScreen">
  <div class="title-brand">ATLAS</div>
  <div class="title-sub">الـطـائـر</div>
  <button class="btn" id="startBtn">ابدأ اللعب</button>
</div>

<div class="overlay" id="overScreen">
  <div class="final-title">انتهت اللعبة!</div>
  <div class="new-record" id="newRecord" style="display:none;">🎉 رقم قياسي جديد! 🎉</div>
  <div class="final-block">
    <div class="item"><div class="lbl">النقاط</div><div class="val" id="finalScore">0</div></div>
    <div class="item"><div class="lbl">المستوى</div><div class="val small" id="finalLevel">1</div></div>
  </div>
  <button class="btn" id="restartBtn">🔄 العب مرة أخرى</button>
</div>

<script>
// ==================== Audio ====================
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function tone({ freq=440, type='sine', dur=0.1, vol=0.1, sweepTo=null, delay=0 }) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.03);
}
function sfxFlap()   { tone({ freq:480, sweepTo:300, type:'sine',     dur:0.09, vol:0.08 }); }
function sfxScore()  { tone({ freq:780, type:'triangle', dur:0.06, vol:0.08 });
                       tone({ freq:1040, type:'triangle', dur:0.09, vol:0.08, delay:0.06 }); }
function sfxHit()    { tone({ freq:200, sweepTo:60, type:'triangle', dur:0.3, vol:0.11 });
                       tone({ freq:130, sweepTo:40, type:'sine',     dur:0.4, vol:0.08 }); }
function sfxLevelUp(){ tone({ freq:620,  type:'triangle', dur:0.08, vol:0.09 });
                       tone({ freq:820,  type:'triangle', dur:0.08, vol:0.09, delay:0.07 });
                       tone({ freq:1080, type:'triangle', dur:0.14, vol:0.09, delay:0.14 }); }
function sfxRecord() { tone({ freq:700,  type:'sine', dur:0.1, vol:0.09 });
                       tone({ freq:900,  type:'sine', dur:0.1, vol:0.09, delay:0.1 });
                       tone({ freq:1200, type:'sine', dur:0.1, vol:0.09, delay:0.2 });
                       tone({ freq:1600, type:'sine', dur:0.25, vol:0.09, delay:0.3 }); }

// ==================== Canvas Setup ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha:false });

const REF_W = 420, REF_H = 700;
const MAX_PIXELS = 1_200_000;

let W = 0, H = 0, DPR = 1, scale = 1;
let playLeft = 0, playRight = 0, playW = 0;
let bgCache = null;
let birdGlowCache = null;
let sunCache = null;

function computeLayout() {
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  if (W * H * dpr * dpr > MAX_PIXELS) dpr = Math.sqrt(MAX_PIXELS / (W * H));
  dpr = Math.max(0.75, dpr);
  DPR = dpr;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = H / REF_H;
  const idealW = REF_W * scale;
  if (W > idealW) { playW = idealW; playLeft = (W - idealW) / 2; playRight = playLeft + idealW; }
  else { playLeft = 0; playW = W; playRight = W; }
  buildBackground();
  buildBirdGlow();
  buildSun();
  if (state.bird) repositionBird();
}

function buildBackground() {
  bgCache = document.createElement('canvas');
  bgCache.width = canvas.width; bgCache.height = canvas.height;
  const b = bgCache.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Deep sky gradient (twilight)
  const sky = b.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0.00, '#080b1a');
  sky.addColorStop(0.30, '#0f1a35');
  sky.addColorStop(0.55, '#1e2a52');
  sky.addColorStop(0.75, '#3d3a6b');
  sky.addColorStop(0.88, '#a5577c');
  sky.addColorStop(1.00, '#f5a15f');
  b.fillStyle = sky;
  b.fillRect(0, 0, W, H);

  // Stars with varying sizes
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H * 0.55;
    const r = Math.random() * 1.6 + 0.3;
    const a = 0.25 + Math.random() * 0.6;
    b.fillStyle = `rgba(255,255,255,${a})`;
    b.beginPath();
    b.arc(x, y, r, 0, Math.PI * 2);
    b.fill();
  }
  // Side vignettes on wide screens
  if (playLeft > 4) {
    const lg = b.createLinearGradient(0, 0, playLeft, 0);
    lg.addColorStop(0, 'rgba(0,0,0,0.6)');
    lg.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = lg; b.fillRect(0, 0, playLeft, H);
    const rg = b.createLinearGradient(W, 0, playRight, 0);
    rg.addColorStop(0, 'rgba(0,0,0,0.6)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = rg; b.fillRect(playRight, 0, W - playRight, H);
  }
}

function buildBirdGlow() {
  birdGlowCache = document.createElement('canvas');
  const gs = 256;
  birdGlowCache.width = gs; birdGlowCache.height = gs;
  const g = birdGlowCache.getContext('2d');
  const grad = g.createRadialGradient(gs/2, gs/2, gs*0.2, gs/2, gs/2, gs/2);
  grad.addColorStop(0,   'rgba(255,235,150,0.75)');
  grad.addColorStop(0.4, 'rgba(245,197,24,0.35)');
  grad.addColorStop(0.7, 'rgba(245,197,24,0.1)');
  grad.addColorStop(1,   'rgba(245,197,24,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, gs, gs);
}

function buildSun() {
  sunCache = document.createElement('canvas');
  const ss = 512;
  sunCache.width = ss; sunCache.height = ss;
  const g = sunCache.getContext('2d');
  const grad = g.createRadialGradient(ss/2, ss/2, 5, ss/2, ss/2, ss/2);
  grad.addColorStop(0,    'rgba(255,245,210,1)');
  grad.addColorStop(0.15, 'rgba(255,220,150,0.95)');
  grad.addColorStop(0.35, 'rgba(255,180,110,0.5)');
  grad.addColorStop(0.7,  'rgba(255,140,80,0.15)');
  grad.addColorStop(1,    'rgba(255,140,80,0)');
  g.fillStyle = grad;
  g.beginPath();
  g.arc(ss/2, ss/2, ss/2, 0, Math.PI * 2);
  g.fill();
}

window.addEventListener('resize', computeLayout);

// ==================== Physics Constants ====================
const GRAVITY    = 1000;
const FLAP_VY    = -410;
const MAX_FALL   = 700;
const BASE_SPEED = 235;
const MAX_SPEED  = 380;
const PIPE_W     = 68;
const PIPE_CAP_H = 26;
const BASE_GAP   = 205;
const MIN_GAP    = 148;
const GROUND_H   = 88;
const BIRD_X_FRAC = 0.30;
const BASE_INTERVAL = 1.35;
const MIN_INTERVAL  = 0.95;

// ==================== State ====================
const state = {
  mode: 'menu',
  score: 0, level: 1, best: 0,
  t: 0,
  bird: null, pipes: [], clouds: [], cloudsFar: [], particles: [], feathers: [],
  groundOffset: 0, spawnTimer: 0,
  shake: 0, hitFlash: 0, levelFlash: 0, scorePop: 0,
  sunRaysPhase: 0,
};

function repositionBird() {
  if (!state.bird) return;
  state.bird.x = playLeft + playW * BIRD_X_FRAC;
  state.bird.r = 16 * scale;
}

function resetGame() {
  state.mode = 'playing';
  state.score = 0; state.level = 1; state.t = 0;
  state.pipes.length = 0; state.particles.length = 0; state.feathers.length = 0;
  state.groundOffset = 0; state.spawnTimer = 0.8;
  state.shake = 0; state.hitFlash = 0; state.levelFlash = 0; state.scorePop = 0;
  state.bird = {
    x: playLeft + playW * BIRD_X_FRAC,
    y: H * 0.42, vy: 0, r: 16 * scale,
    rot: 0, wing: 0, alive: true,
  };
}

function initClouds() {
  state.clouds.length = 0;
  for (let i = 0; i < 3; i++) {
    state.clouds.push({
      x: Math.random() * W,
      y: 80 * scale + Math.random() * H * 0.35,
      s: 0.9 + Math.random() * 0.7,
      sp: 14 + Math.random() * 12,
      a: 0.25 + Math.random() * 0.3,
    });
  }
  state.cloudsFar.length = 0;
  for (let i = 0; i < 4; i++) {
    state.cloudsFar.push({
      x: Math.random() * W,
      y: 60 * scale + Math.random() * H * 0.35,
      s: 0.5 + Math.random() * 0.4,
      sp: 5 + Math.random() * 6,
      a: 0.15 + Math.random() * 0.2,
    });
  }
}

// ==================== Input ====================
function flap() {
  if (state.mode === 'menu') { startGame(); return; }
  if (state.mode !== 'playing' || !state.bird) return;
  state.bird.vy = FLAP_VY * scale;
  state.bird.wing = 1;
  sfxFlap();
  // Feather particles on flap
  for (let i = 0; i < 4; i++) {
    state.feathers.push({
      x: state.bird.x + (Math.random() - 0.5) * 10,
      y: state.bird.y + state.bird.r * 0.6,
      vx: (Math.random() - 0.5) * 60,
      vy: 40 + Math.random() * 80,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 6,
      life: 0.9 + Math.random() * 0.5,
      maxLife: 1.4,
      size: 2.5 + Math.random() * 2,
    });
  }
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); if (state.mode === 'playing') flap(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ==================== Pipes ====================
function spawnPipe() {
  const gapH = Math.max(MIN_GAP * scale, (BASE_GAP - (state.level - 1) * 6) * scale);
  const margin = 50 * scale;
  const minY = margin + gapH / 2;
  const maxY = H - GROUND_H * scale - margin - gapH / 2;
  const gapY = minY + Math.random() * Math.max(1, (maxY - minY));
  state.pipes.push({ x: W + PIPE_W * scale, gapY, gapH, passed: false, hue: (state.level * 20) % 60 });
}

// ==================== Particles ====================
function spawnBurst(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random() * 0.9);
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 40,
      life: 0.5 + Math.random() * 0.4,
      maxLife: 0.9,
      color,
      size: 1.5 + Math.random() * 2.5,
      gravity: 400,
    });
  }
}

// ==================== Update ====================
function update(dt) {
  if (state.mode !== 'playing') return;
  state.t += dt;
  state.sunRaysPhase += dt;

  state.level = Math.floor(state.score / 5) + 1;
  const speed = Math.min(MAX_SPEED, BASE_SPEED + (state.level - 1) * 12) * scale;
  const interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - (state.level - 1) * 0.06);

  const b = state.bird;
  // Physics
  b.vy += GRAVITY * scale * dt;
  if (b.vy > MAX_FALL * scale) b.vy = MAX_FALL * scale;
  b.y += b.vy * dt;

  // Rotation
  const targetRot = Math.max(-0.5, Math.min(1.2, b.vy / (700 * scale)));
  b.rot += (targetRot - b.rot) * Math.min(1, dt * 10);

  // Wing flap animation
  if (b.wing > 0) b.wing = Math.max(0, b.wing - dt * 3.5);

  // Ceiling
  if (b.y - b.r < 0) { b.y = b.r; b.vy = 0; }

  // Ground
  const gy = H - GROUND_H * scale;
  if (b.y + b.r >= gy) { b.y = gy - b.r; gameOver(); return; }

  // Ground scroll
  state.groundOffset += speed * dt;
  if (state.groundOffset > 60 * scale) state.groundOffset -= 60 * scale;

  // Spawn pipes
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) { state.spawnTimer = interval; spawnPipe(); }

  // Pipes
  const pipeW = PIPE_W * scale;
  for (let i = state.pipes.length - 1; i >= 0; i--) {
    const p = state.pipes[i];
    p.x -= speed * dt;
    if (p.x + pipeW < -10) { state.pipes.splice(i, 1); continue; }

    const bx1 = b.x - b.r * 0.82, bx2 = b.x + b.r * 0.82;
    const by1 = b.y - b.r * 0.82, by2 = b.y + b.r * 0.82;
    const pL = p.x, pR = p.x + pipeW;
    const pTopB = p.gapY - p.gapH / 2;
    const pBotT = p.gapY + p.gapH / 2;

    if (bx2 > pL && bx1 < pR) {
      if (by1 < pTopB) { gameOver(); return; }
      if (by2 > pBotT) { gameOver(); return; }
    }

    // Score
    if (!p.passed && pR < b.x - b.r) {
      p.passed = true;
      state.score++;
      state.scorePop = 0.35;
      sfxScore();
      // Sparkle particles at bird
      spawnBurst(b.x + 20, b.y, '#f5c518', 6, 100);
      if (state.score % 5 === 0) {
        state.levelFlash = 1.4;
        sfxLevelUp();
        spawnBurst(b.x, b.y, '#4ade80', 14, 150);
      }
    }
  }

  // Clouds movement
  for (const c of state.clouds) {
    c.x -= c.sp * dt;
    if (c.x < -160) { c.x = W + 60; c.y = 80 * scale + Math.random() * H * 0.35; }
  }
  for (const c of state.cloudsFar) {
    c.x -= c.sp * dt;
    if (c.x < -160) { c.x = W + 60; c.y = 60 * scale + Math.random() * H * 0.35; }
  }

  // Particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.vx *= 0.97;
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
  // Feathers
  for (let i = state.feathers.length - 1; i >= 0; i--) {
    const f = state.feathers[i];
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.rot += f.rotV * dt;
    f.vx *= 0.98;
    f.vy += 180 * dt;
    f.life -= dt;
    if (f.life <= 0) state.feathers.splice(i, 1);
  }

  // Effects decay
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 50);
  if (state.hitFlash > 0) state.hitFlash -= dt;
  if (state.levelFlash > 0) state.levelFlash -= dt;
  if (state.scorePop > 0) state.scorePop -= dt;
}

// ==================== Render ====================
function render() {
  const shX = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;
  const shY = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;

  // Background (pre-rendered)
  if (bgCache) ctx.drawImage(bgCache, 0, 0, W, H);

  // Sun (position relative to time)
  const sunX = W * 0.78;
  const sunY = H * 0.62 + Math.sin(state.t * 0.4) * 4 * scale;
  if (sunCache) {
    const sunSize = 220 * scale;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(sunCache, sunX - sunSize, sunY - sunSize, sunSize * 2, sunSize * 2);
    ctx.restore();
  }

  ctx.save();
  ctx.translate(shX, shY);

  // Far clouds
  for (const c of state.cloudsFar) drawCloud(c.x, c.y, c.s, c.a);
  // Distant hills
  drawHills();
  // Near clouds
  for (const c of state.clouds) drawCloud(c.x, c.y, c.s, c.a);

  // Pipes
  for (let i = 0; i < state.pipes.length; i++) drawPipe(state.pipes[i]);

  // Ground
  drawGround();

  // Feathers (behind bird)
  for (const f of state.feathers) {
    const a = Math.max(0, f.life / f.maxLife);
    ctx.save();
    ctx.globalAlpha = a * 0.9;
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.fillStyle = '#fff5b8';
    ctx.beginPath();
    ctx.ellipse(0, 0, f.size * 1.5, f.size * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // Bird
  if (state.bird) drawBird(state.bird);

  // Particles
  for (const p of state.particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Score
  if (state.mode === 'playing') {
    const pop = state.scorePop > 0 ? 1 + state.scorePop * 0.6 : 1;
    ctx.save();
    ctx.translate(W / 2, 118 * scale);
    ctx.scale(pop, pop);
    ctx.font = `900 ${62 * scale}px "Orbitron", "Reem Kufi", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(state.score, 3, 4);
    ctx.shadowColor = 'rgba(245,197,24,0.6)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(state.score, 0, 0);
    ctx.restore();
  }

  // Hit flash
  if (state.hitFlash > 0) {
    ctx.fillStyle = `rgba(233,69,96,${(state.hitFlash / 0.4) * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Level up flash
  if (state.levelFlash > 0) {
    const a = state.levelFlash / 1.4;
    ctx.fillStyle = `rgba(74,222,128,${a * 0.15})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = a;
    ctx.font = `900 ${40 * scale}px "Orbitron", "Reem Kufi", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(74,222,128,0.8)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#4ade80';
    ctx.fillText(`LV ${state.level}`, W / 2, H * 0.28);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // Menu tap hint
  if (state.mode === 'menu') {
    const pulse = 0.5 + 0.5 * Math.sin(state.t * 2.4);
    ctx.globalAlpha = 0.5 + pulse * 0.4;
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${14 * scale}px "Cairo", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('اضغط لتبدأ', W / 2, H - GROUND_H * scale - 44 * scale);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ==================== Drawing ====================
function drawCloud(x, y, s, a) {
  ctx.globalAlpha = a;
  ctx.fillStyle = '#e8eef5';
  const r = 20 * s * scale;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.arc(x + r * 0.9, y + r * 0.15, r * 0.8, 0, Math.PI * 2);
  ctx.arc(x - r * 0.85, y + r * 0.2, r * 0.7, 0, Math.PI * 2);
  ctx.arc(x + r * 1.6, y + r * 0.35, r * 0.55, 0, Math.PI * 2);
  ctx.arc(x - r * 1.5, y + r * 0.45, r * 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawHills() {
  const baseY = H - GROUND_H * scale + 6 * scale;
  const grad = ctx.createLinearGradient(0, baseY - 60 * scale, 0, baseY);
  grad.addColorStop(0, '#1e3352');
  grad.addColorStop(1, '#142440');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  const step = W / 6;
  const off = (state.groundOffset * 0.004) % 2;
  for (let i = 0; i <= 6; i++) {
    const h = 45 * scale + Math.sin((i + off) * 1.7) * 30 * scale;
    ctx.lineTo(i * step, baseY - h);
  }
  ctx.lineTo(W, baseY);
  ctx.closePath();
  ctx.fill();
}

function drawGround() {
  const gy = H - GROUND_H * scale;
  // Body gradient
  const g = ctx.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0, '#3d2f20');
  g.addColorStop(1, '#1a1208');
  ctx.fillStyle = g;
  ctx.fillRect(0, gy, W, GROUND_H * scale);
  // Sand top strip
  ctx.fillStyle = '#c8a86b';
  ctx.fillRect(0, gy, W, 5 * scale);
  ctx.fillStyle = '#8a7043';
  ctx.fillRect(0, gy + 5 * scale, W, 3 * scale);
  // Scrolling vertical stripes
  const sw = 34 * scale;
  const off = state.groundOffset % sw;
  ctx.fillStyle = 'rgba(200,168,107,0.15)';
  for (let x = -sw + off; x < W; x += sw) {
    ctx.fillRect(x, gy + 14 * scale, 3 * scale, GROUND_H * scale - 14 * scale);
  }
  // Glow top edge
  ctx.fillStyle = 'rgba(245,197,24,0.45)';
  ctx.fillRect(0, gy - 1, W, 1);
}

function drawPipe(p) {
  const pw = PIPE_W * scale, capH = PIPE_CAP_H * scale, oh = 6 * scale;
  const pTopB = p.gapY - p.gapH / 2;
  const pBotT = p.gapY + p.gapH / 2;

  // Glow around pipe
  const glow = ctx.createRadialGradient(p.x + pw/2, p.gapY, 0, p.x + pw/2, p.gapY, p.gapH);
  glow.addColorStop(0, 'rgba(245,197,24,0.08)');
  glow.addColorStop(1, 'rgba(245,197,24,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(p.x - 30, 0, pw + 60, H);

  // Colors with level shift
  const hue = 140 + p.hue; // greenish to golden
  const bodyColor  = `hsl(${hue}, 55%, 32%)`;
  const darkColor  = `hsl(${hue}, 60%, 18%)`;
  const lightColor = `hsl(${hue}, 70%, 58%)`;

  // Top pipe
  ctx.fillStyle = bodyColor;
  ctx.fillRect(p.x, 0, pw, pTopB - capH);
  ctx.fillStyle = darkColor;
  ctx.fillRect(p.x, 0, pw * 0.25, pTopB - capH);
  ctx.fillStyle = lightColor;
  ctx.fillRect(p.x + pw * 0.62, 0, pw * 0.14, pTopB - capH);
  // Top cap
  ctx.fillStyle = bodyColor;
  ctx.fillRect(p.x - oh, pTopB - capH, pw + oh * 2, capH);
  ctx.fillStyle = lightColor;
  ctx.fillRect(p.x - oh, pTopB - capH + 3 * scale, pw + oh * 2, 2 * scale);
  ctx.strokeStyle = `hsl(${hue}, 60%, 45%)`;
  ctx.lineWidth = 1.5 * scale;
  ctx.strokeRect(p.x - oh, pTopB - capH, pw + oh * 2, capH);

  // Bottom pipe
  ctx.fillStyle = bodyColor;
  ctx.fillRect(p.x - oh, pBotT, pw + oh * 2, capH);
  ctx.fillStyle = lightColor;
  ctx.fillRect(p.x - oh, pBotT + capH - 5 * scale, pw + oh * 2, 2 * scale);
  ctx.strokeStyle = `hsl(${hue}, 60%, 45%)`;
  ctx.strokeRect(p.x - oh, pBotT, pw + oh * 2, capH);

  const botY = pBotT + capH;
  const botH = H - GROUND_H * scale - botY;
  if (botH > 0) {
    ctx.fillStyle = bodyColor;
    ctx.fillRect(p.x, botY, pw, botH);
    ctx.fillStyle = darkColor;
    ctx.fillRect(p.x, botY, pw * 0.25, botH);
    ctx.fillStyle = lightColor;
    ctx.fillRect(p.x + pw * 0.62, botY, pw * 0.14, botH);
  }
}

function drawBird(b) {
  const r = b.r;

  // Ground shadow
  const gy = H - GROUND_H * scale;
  const dist = Math.max(0, gy - b.y);
  const maxDist = H * 0.7;
  const shadowA = Math.max(0, 0.35 * (1 - dist / maxDist));
  if (shadowA > 0.02) {
    ctx.globalAlpha = shadowA;
    ctx.fillStyle = '#000';
    const s = Math.max(0.4, 1 - dist / maxDist * 0.6);
    ctx.beginPath();
    ctx.ellipse(b.x + 3, gy + 4, r * 1.1 * s, r * 0.4 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Outer glow
  if (birdGlowCache) {
    const gs = r * 4;
    ctx.drawImage(birdGlowCache, b.x - gs/2, b.y - gs/2, gs, gs);
  }

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot);

  // Body circle with gradient
  const bodyG = ctx.createRadialGradient(-r*0.25, -r*0.3, r*0.15, 0, 0, r);
  bodyG.addColorStop(0, '#fff9d6');
  bodyG.addColorStop(0.5, '#f5c518');
  bodyG.addColorStop(1, '#b8860b');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Belly highlight
  ctx.fillStyle = 'rgba(255,250,220,0.75)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.1, -r * 0.3, r * 0.55, r * 0.4, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Bottom shading
  ctx.fillStyle = 'rgba(139,92,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.55, r * 0.7, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eye (white)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(r * 0.42, -r * 0.32, r * 0.34, 0, Math.PI * 2);
  ctx.fill();
  // Iris
  const irisG = ctx.createRadialGradient(r * 0.5, -r * 0.36, r * 0.02, r * 0.5, -r * 0.32, r * 0.16);
  irisG.addColorStop(0, '#333');
  irisG.addColorStop(1, '#000');
  ctx.fillStyle = irisG;
  ctx.beginPath();
  ctx.arc(r * 0.52, -r * 0.32, r * 0.16, 0, Math.PI * 2);
  ctx.fill();
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(r * 0.58, -r * 0.4, r * 0.06, 0, Math.PI * 2);
  ctx.fill();

  // Cheek blush
  ctx.fillStyle = 'rgba(255,120,120,0.35)';
  ctx.beginPath();
  ctx.arc(r * 0.15, r * 0.15, r * 0.16, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#ff8c00';
  ctx.beginPath();
  ctx.moveTo(r * 0.85, -r * 0.08);
  ctx.lineTo(r * 1.45, r * 0.05);
  ctx.lineTo(r * 0.85, r * 0.22);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#b35a00';
  ctx.lineWidth = 1.2 * scale;
  ctx.stroke();
  // Beak highlight
  ctx.fillStyle = 'rgba(255,220,150,0.6)';
  ctx.beginPath();
  ctx.moveTo(r * 0.9, -r * 0.04);
  ctx.lineTo(r * 1.4, r * 0.03);
  ctx.lineTo(r * 0.9, r * 0.06);
  ctx.closePath();
  ctx.fill();

  // Wing (animated)
  const wingAngle = -0.5 + b.wing * 1.3;
  ctx.save();
  ctx.translate(-r * 0.15, r * 0.05);
  ctx.rotate(wingAngle);
  const wingG = ctx.createLinearGradient(0, 0, -r * 1.1, r * 0.5);
  wingG.addColorStop(0, '#f5c518');
  wingG.addColorStop(1, '#a87600');
  ctx.fillStyle = wingG;
  ctx.beginPath();
  ctx.ellipse(-r * 0.55, 0, r * 0.8, r * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,80,0,0.7)';
  ctx.lineWidth = 1.2 * scale;
  ctx.stroke();
  // Wing feathers detail
  ctx.strokeStyle = 'rgba(120,80,0,0.5)';
  ctx.lineWidth = 0.8 * scale;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-r * 0.4 - i * r * 0.2, -r * 0.15);
    ctx.lineTo(-r * 0.4 - i * r * 0.2, r * 0.15);
    ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
}

// ==================== Flow ====================
function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch(e){} }
  document.getElementById('startScreen').classList.remove('show');
  document.getElementById('overScreen').classList.remove('show');
  resetGame();
  state.bird.vy = FLAP_VY * scale * 0.5;
  sfxFlap();
}

function gameOver() {
  state.mode = 'over';
  state.shake = 18 * scale;
  state.hitFlash = 0.4;
  sfxHit();

  const isNewRecord = state.score > state.best;
  if (isNewRecord) {
    state.best = state.score;
    try { localStorage.setItem('atlas_best', String(state.best)); } catch(e){}
    sfxRecord();
  }
  updateBestBadge();

  document.getElementById('finalScore').textContent = state.score;
  document.getElementById('finalLevel').textContent = state.level;
  document.getElementById('newRecord').style.display = isNewRecord ? 'block' : 'none';
  document.getElementById('overScreen').classList.add('show');
}

function updateBestBadge() {
  document.getElementById('bestVal').textContent = state.best;
}

// ==================== UI ====================
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// Load best
try {
  const sb = parseInt(localStorage.getItem('atlas_best') || '0', 10);
  if (!isNaN(sb)) state.best = sb;
} catch(e){}
updateBestBadge();

computeLayout();
initClouds();

// Warmup renders (compile JIT, avoid first-flap stutter)
(function warmup() {
  const tb = { x: -200, y: -200, r: 16 * scale, rot: 0, wing: 0.5 };
  state.bird = tb;
  for (let i = 0; i < 3; i++) render();
  state.bird = null;
})();

// ==================== Loop (with FPS cap) ====================
let lastTime = 0, lastRender = 0;
const FRAME_MS = 14; // ~70 FPS cap
function loop(now) {
  requestAnimationFrame(loop);
  if (now - lastRender < FRAME_MS) return;
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now; lastRender = now;
  if (dt > 0.05) dt = 0.05;

  if (state.mode === 'playing') {
    update(dt);
  } else if (state.mode === 'menu') {
    state.t += dt;
    state.sunRaysPhase += dt;
    for (const c of state.clouds) {
      c.x -= c.sp * dt;
      if (c.x < -160) { c.x = W + 60; c.y = 80 * scale + Math.random() * H * 0.35; }
    }
    for (const c of state.cloudsFar) {
      c.x -= c.sp * dt;
      if (c.x < -160) { c.x = W + 60; c.y = 60 * scale + Math.random() * H * 0.35; }
    }
    if (!state.bird) state.bird = {
      x: playLeft + playW * BIRD_X_FRAC, y: H * 0.42,
      vy: 0, r: 16 * scale, rot: 0, wing: 0.5, alive: true,
    };
    const b = state.bird;
    b.y = H * 0.42 + Math.sin(state.t * 2.6) * 6 * scale;
    b.rot = Math.sin(state.t * 1.8) * 0.12;
    b.wing = 0.5 + 0.5 * Math.sin(state.t * 7);
  }

  render();
}
requestAnimationFrame(loop);

document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  if (document.hidden) { try { audioCtx.suspend(); } catch(e){} }
  else { try { audioCtx.resume(); } catch(e){} }
});
</script>
