<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1a2b">
<title>فوج النيبة — الطائر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Reem+Kufi:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0e1a2b; color:#e8eef5;
    font-family:'Cairo', sans-serif;
    touch-action:none;
  }
  #canvas {
    position:absolute; inset:0; display:block;
    width:100%; height:100%; touch-action:none;
  }

  /* ===== HUD ===== */
  #hud {
    position:absolute; top:0; left:0; right:0;
    padding:14px 18px; pointer-events:none; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  #title {
    font-family:'Reem Kufi', 'Cairo', sans-serif;
    font-size:22px; font-weight:700;
    color:#f5c518; letter-spacing:1px;
    text-shadow: 0 0 6px rgba(245,197,24,0.55), 0 0 14px rgba(245,197,24,0.3);
    animation: glow 2.6s ease-in-out infinite alternate;
    line-height:1;
  }
  @keyframes glow {
    from { text-shadow: 0 0 4px rgba(245,197,24,0.45), 0 0 10px rgba(245,197,24,0.18); opacity:0.94; }
    to   { text-shadow: 0 0 10px rgba(245,197,24,0.9), 0 0 22px rgba(245,197,24,0.45); opacity:1; }
  }
  #title small {
    display:block; font-family:'Cairo', sans-serif;
    font-size:11px; font-weight:600; color:#8ba7c4;
    letter-spacing:2px; margin-top:2px;
    text-shadow:none; animation:none;
  }
  #bestBadge {
    background:rgba(245,197,24,0.12);
    border:1px solid rgba(245,197,24,0.35);
    border-radius:10px;
    padding:5px 11px;
    font-size:12px; color:#f5c518; font-weight:700;
    text-align:center;
  }
  #bestBadge .v { display:block; font-size:16px; color:#fff; }
  #bestBadge .l { display:block; font-size:10px; color:#c8b26a; }

  /* ===== Overlays ===== */
  .overlay {
    position:absolute; inset:0;
    display:none; flex-direction:column;
    justify-content:center; align-items:center;
    background: radial-gradient(circle at 50% 40%, rgba(14,26,43,0.9), rgba(5,10,18,0.97));
    z-index:10; padding:24px; text-align:center; overflow-y:auto;
    backdrop-filter: blur(4px);
  }
  .overlay.show { display:flex; animation: fadein 0.25s ease; }
  @keyframes fadein { from{opacity:0;} to{opacity:1;} }

  .title-main {
    font-family:'Reem Kufi', 'Cairo', sans-serif;
    font-size:38px; font-weight:700; letter-spacing:2px;
    color:#f5c518; margin-bottom:6px;
    text-shadow: 0 0 10px rgba(245,197,24,0.55), 0 0 24px rgba(245,197,24,0.28);
    animation: glow 2.6s ease-in-out infinite alternate;
  }
  .title-sub {
    font-family:'Cairo', sans-serif;
    font-size:14px; color:#8ba7c4; letter-spacing:3px;
    margin-bottom:28px; font-weight:600;
  }

  .btn {
    font-family:'Cairo', sans-serif;
    padding:14px 46px; font-size:19px; font-weight:700;
    background: linear-gradient(180deg, #f5c518, #d4a017);
    color:#1a1a1a; border:none; border-radius:14px;
    cursor:pointer; box-shadow: 0 5px 0 #8b6f0f;
    transition: transform 0.08s;
    margin:6px 0; letter-spacing:0.5px;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #8b6f0f; }
  .btn.secondary {
    background: linear-gradient(180deg, #3b82f6, #1d4ed8);
    box-shadow: 0 5px 0 #0c2d6b; color:#fff;
  }
  .btn.ghost {
    background: rgba(255,255,255,0.06);
    box-shadow: 0 5px 0 rgba(0,0,0,0.4); color:#c8d4e0;
    border:1px solid rgba(255,255,255,0.1);
    font-size:16px; padding:12px 28px;
  }

  /* Over stats */
  .final-block {
    display:flex; gap:26px; margin:6px 0 22px;
    align-items:center; justify-content:center;
  }
  .final-block .item { text-align:center; }
  .final-block .lbl {
    font-size:12px; color:#8ba7c4; font-weight:600;
    letter-spacing:2px; margin-bottom:2px;
  }
  .final-block .val {
    font-family:'Reem Kufi', 'Cairo', sans-serif;
    font-size:44px; font-weight:700; color:#f5c518;
    line-height:1; text-shadow: 0 0 16px rgba(245,197,24,0.55);
  }
  .final-block .val.small { font-size:28px; color:#8bc34a; text-shadow: 0 0 12px rgba(139,195,74,0.5); }

  /* Leaderboard */
  .leaderboard {
    width:100%; max-width:340px;
    background: rgba(20,32,48,0.85);
    border:1px solid rgba(245,197,24,0.2);
    border-radius:14px;
    padding:14px; margin-top:12px;
  }
  .leaderboard h3 {
    font-family:'Reem Kufi', 'Cairo', sans-serif;
    font-size:15px; font-weight:700; color:#f5c518;
    margin-bottom:10px; letter-spacing:1px;
  }
  .leaderboard ul { list-style:none; }
  .leaderboard li {
    display:flex; justify-content:space-between;
    padding:7px 10px; font-size:14px; font-weight:600;
    border-bottom:1px solid rgba(255,255,255,0.05);
    border-radius:6px;
  }
  .leaderboard li:last-child { border-bottom:none; }
  .leaderboard li.me { background: rgba(245,197,24,0.1); }
  .leaderboard li .pts { color:#f5c518; font-weight:800; }
  .leaderboard li .rank { color:#8ba7c4; font-weight:700; margin-left:8px; font-size:13px; }

  /* Small hint text */
  .hint {
    max-width:320px; color:#8ba7c4; font-size:13px;
    line-height:1.9; margin-bottom:22px; font-weight:500;
  }
  .hint b { color:#8bc34a; }
  .hint .tap { color:#f5c518; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud">
  <div id="title">
    فوج النيبة
    <small>الـطـائـر الـطـائـر</small>
  </div>
  <div id="bestBadge">
    <span class="v" id="hudBest">0</span>
    <span class="l">أفضل نتيجة</span>
  </div>
</div>

<!-- Start Screen -->
<div class="overlay show" id="startScreen">
  <div class="title-main">فوج النيبة</div>
  <div class="title-sub">الـطـائـر الـطـائـر</div>
  <p class="hint">
    • المس أي مكان بالشاشة عشان الطائر يطير<br>
    • تفادى الأنابيب 🚧<br>
    • كل <b>5 نقاط</b> = <span class="tap">مستوى أصعب</span><br>
    • سجّل أعلى نتيجة لمجموعتك 🏆
  </p>
  <button class="btn" id="startBtn">▶ ابدأ اللعب</button>
</div>

<!-- Game Over Screen -->
<div class="overlay" id="gameOverScreen">
  <div style="font-family:'Reem Kufi',sans-serif;font-size:26px;font-weight:700;color:#e94560;margin-bottom:8px;letter-spacing:1px;">انتهت اللعبة!</div>
  <div class="final-block">
    <div class="item">
      <div class="lbl">النقاط</div>
      <div class="val" id="finalScore">0</div>
    </div>
    <div class="item">
      <div class="lbl">المستوى</div>
      <div class="val small" id="finalLevel">1</div>
    </div>
  </div>
  <button class="btn" id="restartBtn">🔄 العب مرة أخرى</button>
  <button class="btn secondary" id="sendBtn">📤 أرسل نتيجتي للمجموعة</button>
  <div class="leaderboard">
    <h3>🏆 أفضل اللاعبين في هذه المجموعة</h3>
    <ul id="leaderboardList"></ul>
  </div>
</div>

<script>
// ============ Telegram ============
const tg = window.Telegram?.WebApp;
if (tg) {
  try { tg.expand(); tg.ready(); tg.setHeaderColor('#0e1a2b'); tg.setBackgroundColor('#0e1a2b'); } catch(e){}
}
const tgUser = tg?.initDataUnsafe?.user || { first_name: 'لاعب', id: 0 };
const tgChat = tg?.initDataUnsafe?.chat || null;

// ============ Audio (Web Audio API - no files needed) ============
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) { audioCtx = null; }
}
function beep({freq=440, type='square', dur=0.08, vol=0.06, sweepTo=null} = {}) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}
function sfxFlap() { beep({ freq: 620, sweepTo: 320, type:'sine', dur:0.07, vol:0.07 }); }
function sfxScore() {
  beep({ freq: 780, type:'triangle', dur:0.06, vol:0.06 });
  setTimeout(() => beep({ freq: 1040, type:'triangle', dur:0.09, vol:0.06 }), 60);
}
function sfxHit() {
  beep({ freq: 220, sweepTo: 60, type:'sawtooth', dur:0.28, vol:0.09 });
  beep({ freq: 140, sweepTo: 40, type:'square', dur:0.35, vol:0.05 });
}
function sfxLevelUp() {
  beep({ freq: 660, type:'triangle', dur:0.08, vol:0.07 });
  setTimeout(() => beep({ freq: 880, type:'triangle', dur:0.08, vol:0.07 }), 70);
  setTimeout(() => beep({ freq: 1180, type:'triangle', dur:0.12, vol:0.07 }), 140);
}

// ============ Canvas & Sizing ============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1, SCALE = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Scale factor relative to a 720px tall reference
  SCALE = H / 720;
  // Clamp scale to avoid extremes
  SCALE = Math.max(0.7, Math.min(1.6, SCALE));
}
window.addEventListener('resize', resize);
resize();

// ============ Game Constants ============
const GROUND_H   = () => 90 * SCALE;
const PIPE_W     = () => 70 * SCALE;
const PIPE_CAP_H = () => 26 * SCALE;
const BIRD_X_RATIO = 0.30;
const GRAVITY    = () => 1500 * SCALE;
const FLAP_VY    = () => -430 * SCALE;
const MAX_FALL   = () => 900 * SCALE;
const BASE_GAP   = () => 190 * SCALE;
const MIN_GAP    = () => 130 * SCALE;
const BASE_SPEED = () => 175 * SCALE;
const MAX_SPEED  = () => 320 * SCALE;
const BASE_INTERVAL = () => 1.55;   // seconds between pipe spawns
const MIN_INTERVAL  = () => 1.00;

// ============ Game State ============
const state = {
  mode: 'menu',        // menu | playing | over
  score: 0,
  level: 1,
  best: 0,
  t: 0,                // total time
  bird: null,
  pipes: [],
  clouds: [],
  stars: [],
  groundOffset: 0,
  spawnTimer: 0,
  shake: 0,
  hitFlash: 0,
  levelFlash: 0,
  scorePop: 0,
};

function resetGame() {
  state.mode = 'playing';
  state.score = 0;
  state.level = 1;
  state.t = 0;
  state.pipes.length = 0;
  state.groundOffset = 0;
  state.spawnTimer = 0.9;
  state.shake = 0;
  state.hitFlash = 0;
  state.levelFlash = 0;
  state.scorePop = 0;

  const bx = W * BIRD_X_RATIO;
  const by = H * 0.42;
  state.bird = {
    x: bx, y: by,
    vy: 0,
    r: 15 * SCALE,
    rot: 0,         // rotation angle
    wing: 0,        // wing animation phase
    alive: true,
  };
  updateBestBadge();
  updateHUDScoreDisplay();
}

// ============ Clouds & Stars (background) ============
function initBG() {
  state.clouds.length = 0;
  const n = 5;
  for (let i = 0; i < n; i++) {
    state.clouds.push({
      x: Math.random() * W,
      y: 60 * SCALE + Math.random() * H * 0.35,
      s: 0.6 + Math.random() * 0.8,
      sp: 8 + Math.random() * 12,
      a: 0.35 + Math.random() * 0.35,
    });
  }
  state.stars.length = 0;
  for (let i = 0; i < 40; i++) {
    state.stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      r: Math.random() * 1.4 + 0.3,
      tw: Math.random() * Math.PI * 2,
      sp: 1 + Math.random() * 2,
    });
  }
}
initBG();
window.addEventListener('resize', initBG);

// ============ Input ============
function flap() {
  if (state.mode === 'menu') {
    startGame();
    return;
  }
  if (state.mode === 'over') return;
  if (!state.bird) return;
  state.bird.vy = FLAP_VY();
  state.bird.wing = 1;
  sfxFlap();
  if (tg?.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch(e){} }
}

function onPointer(e) {
  e.preventDefault();
  // Ignore taps on buttons/overlays when not playing
  if (state.mode !== 'playing') return;
  flap();
}
canvas.addEventListener('pointerdown', onPointer);
// Desktop
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') {
    e.preventDefault();
    flap();
  }
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ============ Pipes ============
function spawnPipe() {
  const gapH = Math.max(MIN_GAP(), BASE_GAP() - (state.level - 1) * 10 * SCALE);
  const margin = 40 * SCALE;
  const minGapY = margin + gapH / 2;
  const maxGapY = H - GROUND_H() - margin - gapH / 2;
  const gapY = minGapY + Math.random() * (maxGapY - minGapY);
  state.pipes.push({
    x: W + PIPE_W(),
    gapY: gapY,
    gapH: gapH,
    passed: false,
    hue: (state.level * 25) % 360,
  });
}

// ============ Update ============
function update(dt) {
  if (state.mode !== 'playing') return;
  state.t += dt;

  // Difficulty
  state.level = Math.floor(state.score / 5) + 1;

  const speed = Math.min(MAX_SPEED(), BASE_SPEED() + (state.level - 1) * 14 * SCALE);
  const interval = Math.max(MIN_INTERVAL(), BASE_INTERVAL() - (state.level - 1) * 0.07);

  // Bird physics
  const b = state.bird;
  b.vy += GRAVITY() * dt;
  if (b.vy > MAX_FALL()) b.vy = MAX_FALL();
  b.y += b.vy * dt;

  // Rotation
  const targetRot = Math.max(-0.5, Math.min(1.2, b.vy / (700 * SCALE)));
  b.rot += (targetRot - b.rot) * Math.min(1, dt * 10);

  // Wing animation
  if (b.wing > 0) b.wing -= dt * 3;
  if (b.wing < 0) b.wing = 0;

  // Ceiling collision
  if (b.y - b.r < 0) {
    b.y = b.r;
    b.vy = 0;
  }

  // Ground collision
  const gy = H - GROUND_H();
  if (b.y + b.r >= gy) {
    b.y = gy - b.r;
    gameOver();
    return;
  }

  // Ground scroll
  state.groundOffset = (state.groundOffset + speed * dt) % 40;

  // Spawn pipes
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    state.spawnTimer = interval;
    spawnPipe();
  }

  // Update pipes & collision
  const px = b.x;
  for (let i = state.pipes.length - 1; i >= 0; i--) {
    const p = state.pipes[i];
    p.x -= speed * dt;
    if (p.x + PIPE_W() < -20) { state.pipes.splice(i, 1); continue; }

    // Collision check
    const bx1 = px - b.r * 0.9, bx2 = px + b.r * 0.9;
    const by1 = b.y - b.r * 0.9, by2 = b.y + b.r * 0.9;
    const pL = p.x, pR = p.x + PIPE_W();
    const pTopB = p.gapY - p.gapH / 2;
    const pBotT = p.gapY + p.gapH / 2;

    if (bx2 > pL && bx1 < pR) {
      // Hits top pipe
      if (by1 < pTopB) { gameOver(); return; }
      // Hits bottom pipe
      if (by2 > pBotT) { gameOver(); return; }
    }

    // Score
    if (!p.passed && pR < px - b.r) {
      p.passed = true;
      state.score++;
      state.scorePop = 0.35;
      sfxScore();
      if (tg?.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch(e){} }
      if (state.score % 5 === 0) {
        state.levelFlash = 1.4;
        sfxLevelUp();
        if (tg?.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){} }
      }
      updateHUDScoreDisplay();
    }
  }

  // Background clouds
  for (const c of state.clouds) {
    c.x -= c.sp * dt;
    if (c.x < -140) {
      c.x = W + 60;
      c.y = 60 * SCALE + Math.random() * H * 0.35;
    }
  }
  // Stars twinkle
  for (const s of state.stars) s.tw += dt * s.sp;

  // Effects
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 60);
  if (state.hitFlash > 0) state.hitFlash -= dt;
  if (state.levelFlash > 0) state.levelFlash -= dt;
  if (state.scorePop > 0) state.scorePop -= dt;
}

// ============ Render ============
function render() {
  const shX = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;
  const shY = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;

  ctx.save();
  ctx.translate(shX, shY);

  // ===== Sky gradient =====
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0.00, '#0e1a2b');
  sky.addColorStop(0.45, '#182a44');
  sky.addColorStop(0.72, '#3a4a6b');
  sky.addColorStop(0.90, '#c96466');
  sky.addColorStop(1.00, '#f0a15f');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // ===== Stars =====
  for (const s of state.stars) {
    const a = 0.4 + 0.5 * (0.5 + 0.5 * Math.sin(s.tw));
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // ===== Sun / moon glow =====
  const sunX = W * 0.78, sunY = H * 0.62;
  const sunR = 70 * SCALE;
  const sunG = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, sunR * 2);
  sunG.addColorStop(0, 'rgba(255, 220, 150, 0.85)');
  sunG.addColorStop(0.4, 'rgba(255, 180, 100, 0.35)');
  sunG.addColorStop(1, 'rgba(255, 140, 80, 0)');
  ctx.fillStyle = sunG;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 235, 200, 0.95)';
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 0.5, 0, Math.PI * 2);
  ctx.fill();

  // ===== Clouds =====
  for (const c of state.clouds) {
    drawCloud(c.x, c.y, c.s, c.a);
  }

  // ===== Distant hills =====
  drawHills();

  // ===== Pipes =====
  for (const p of state.pipes) drawPipe(p);

  // ===== Ground =====
  drawGround();

  // ===== Bird =====
  if (state.bird) drawBird(state.bird);

  // ===== Big score (while playing) =====
  if (state.mode === 'playing') {
    const popScale = 1 + (state.scorePop > 0 ? state.scorePop * 0.6 : 0);
    ctx.save();
    ctx.translate(W / 2, 130 * SCALE);
    ctx.scale(popScale, popScale);
    ctx.font = `700 ${56 * SCALE}px "Reem Kufi", "Cairo", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(state.score, 0, 0);
    ctx.restore();
  }

  // ===== Hit flash =====
  if (state.hitFlash > 0) {
    const a = (state.hitFlash / 0.4) * 0.55;
    ctx.fillStyle = `rgba(233,69,96,${a})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ===== Level up flash =====
  if (state.levelFlash > 0) {
    const a = state.levelFlash / 1.4;
    ctx.fillStyle = `rgba(245, 197, 24, ${a * 0.18})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#f5c518';
    ctx.font = `700 ${36 * SCALE}px "Reem Kufi", "Cairo", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(245,197,24,0.7)';
    ctx.shadowBlur = 20;
    ctx.fillText(`⚡ المستوى ${state.level}`, W / 2, H * 0.32);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // ===== Tap hint (menu) =====
  if (state.mode === 'menu') {
    const pulse = 0.5 + 0.5 * Math.sin(state.t * 2.5);
    ctx.globalAlpha = 0.55 + pulse * 0.35;
    ctx.fillStyle = '#ffffff';
    ctx.font = `600 ${15 * SCALE}px "Cairo", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('اضغط لتبدأ', W / 2, H - GROUND_H() - 40 * SCALE);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ============ Drawing Helpers ============
function drawCloud(x, y, s, a) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#dfe9f3';
  const r = 22 * s * SCALE;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.arc(x + r * 0.9, y + r * 0.15, r * 0.85, 0, Math.PI * 2);
  ctx.arc(x - r * 0.9, y + r * 0.2, r * 0.75, 0, Math.PI * 2);
  ctx.arc(x + r * 1.7, y + r * 0.35, r * 0.6, 0, Math.PI * 2);
  ctx.arc(x - r * 1.6, y + r * 0.4, r * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawHills() {
  const baseY = H - GROUND_H() + 10;
  ctx.fillStyle = '#243b55';
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  const step = W / 6;
  for (let i = 0; i <= 6; i++) {
    const h = 40 * SCALE + Math.sin((i + state.groundOffset * 0.005) * 1.7) * 30 * SCALE;
    ctx.lineTo(i * step, baseY - h);
  }
  ctx.lineTo(W, baseY);
  ctx.closePath();
  ctx.fill();
}

function drawGround() {
  const gy = H - GROUND_H();
  // Base
  const g = ctx.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0, '#3b2d1f');
  g.addColorStop(1, '#1a1410');
  ctx.fillStyle = g;
  ctx.fillRect(0, gy, W, GROUND_H());

  // Top edge highlight (sand)
  ctx.fillStyle = '#c8a86b';
  ctx.fillRect(0, gy, W, 6 * SCALE);
  ctx.fillStyle = '#8a7043';
  ctx.fillRect(0, gy + 6 * SCALE, W, 4 * SCALE);

  // Stripes (scrolling pattern)
  const sw = 30 * SCALE;
  ctx.fillStyle = 'rgba(200, 168, 107, 0.28)';
  const off = state.groundOffset % sw;
  for (let x = -sw; x < W + sw; x += sw) {
    ctx.fillRect(x + off, gy + 12 * SCALE, 3 * SCALE, GROUND_H() - 12 * SCALE);
  }

  // Top glow line
  ctx.fillStyle = 'rgba(245,197,24,0.35)';
  ctx.fillRect(0, gy - 1, W, 1);
}

function drawPipe(p) {
  const pw = PIPE_W();
  const capH = PIPE_CAP_H();
  const capOverhang = 6 * SCALE;
  const pTopB = p.gapY - p.gapH / 2;
  const pBotT = p.gapY + p.gapH / 2;

  // Pipe body gradient (deep green with neon edge)
  const bodyG = ctx.createLinearGradient(p.x, 0, p.x + pw, 0);
  bodyG.addColorStop(0.00, '#1e5631');
  bodyG.addColorStop(0.35, '#2e7d32');
  bodyG.addColorStop(0.55, '#4caf50');
  bodyG.addColorStop(0.85, '#2e7d32');
  bodyG.addColorStop(1.00, '#0d2e18');

  // Top pipe
  ctx.fillStyle = bodyG;
  ctx.fillRect(p.x, 0, pw, pTopB - capH);
  // Cap
  ctx.fillStyle = bodyG;
  ctx.fillRect(p.x - capOverhang, pTopB - capH, pw + capOverhang * 2, capH);
  // Neon edge top pipe
  ctx.strokeStyle = 'rgba(139, 195, 74, 0.7)';
  ctx.lineWidth = 2 * SCALE;
  ctx.strokeRect(p.x - capOverhang, pTopB - capH, pw + capOverhang * 2, capH);

  // Bottom pipe
  const botY = pBotT + capH;
  ctx.fillStyle = bodyG;
  ctx.fillRect(p.x - capOverhang, pBotT, pw + capOverhang * 2, capH);
  ctx.fillRect(p.x, botY, pw, H - GROUND_H() - botY);
  ctx.strokeStyle = 'rgba(139, 195, 74, 0.7)';
  ctx.strokeRect(p.x - capOverhang, pBotT, pw + capOverhang * 2, capH);
}

function drawBird(b) {
  // Shadow
  const gy = H - GROUND_H();
  const shadowY = gy;
  const dist = Math.max(0, shadowY - b.y);
  const maxDist = H * 0.7;
  const shadowA = Math.max(0, 0.35 * (1 - dist / maxDist));
  const shadowScale = Math.max(0.35, 1 - dist / maxDist * 0.6);
  if (shadowA > 0.02) {
    ctx.save();
    ctx.globalAlpha = shadowA;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(b.x + 4, shadowY + 4, b.r * 1.1 * shadowScale, b.r * 0.4 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot);

  const r = b.r;

  // Outer glow
  ctx.save();
  ctx.shadowColor = 'rgba(245,197,24,0.7)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#f5c518';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Body gradient
  const bodyG = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.15, 0, 0, r);
  bodyG.addColorStop(0, '#fff5b8');
  bodyG.addColorStop(0.5, '#f5c518');
  bodyG.addColorStop(1, '#c18e00');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.35, r * 0.55, r * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eye (white)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(r * 0.4, -r * 0.35, r * 0.32, 0, Math.PI * 2);
  ctx.fill();
  // Eye (black)
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(r * 0.5, -r * 0.35, r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(r * 0.55, -r * 0.42, r * 0.05, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#ff8c00';
  ctx.beginPath();
  ctx.moveTo(r * 0.85, -r * 0.05);
  ctx.lineTo(r * 1.5, r * 0.05);
  ctx.lineTo(r * 0.85, r * 0.25);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#a35400';
  ctx.lineWidth = 1.5 * SCALE;
  ctx.stroke();

  // Wing (animated)
  const wingPhase = b.wing;
  const wingAngle = -0.6 + wingPhase * 1.2;
  ctx.save();
  ctx.translate(-r * 0.15, r * 0.05);
  ctx.rotate(wingAngle);
  const wingG = ctx.createLinearGradient(0, 0, -r * 1.1, r * 0.5);
  wingG.addColorStop(0, '#f5c518');
  wingG.addColorStop(1, '#a87600');
  ctx.fillStyle = wingG;
  ctx.beginPath();
  ctx.ellipse(-r * 0.5, 0, r * 0.75, r * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,80,0,0.7)';
  ctx.lineWidth = 1.2 * SCALE;
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

// ============ HUD ============
function updateHUDScoreDisplay() {
  // Big score is drawn on canvas; HUD just handles best badge
}
function updateBestBadge() {
  document.getElementById('hudBest').textContent = state.best;
}

// ============ Game Flow ============
function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  document.getElementById('startScreen').classList.remove('show');
  document.getElementById('gameOverScreen').classList.remove('show');
  resetGame();
  // Quick initial flap to get going
  state.bird.vy = FLAP_VY() * 0.55;
  sfxFlap();
}

function gameOver() {
  state.mode = 'over';
  state.shake = 16 * SCALE;
  state.hitFlash = 0.4;
  sfxHit();
  if (tg?.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('error'); } catch(e){} }

  // Save best
  if (state.score > state.best) state.best = state.score;
  saveLocalScore();
  updateBestBadge();
  localStorage.setItem('neba_best', String(state.best));

  // UI
  document.getElementById('finalScore').textContent = state.score;
  document.getElementById('finalLevel').textContent = state.level;
  renderLeaderboard();
  document.getElementById('gameOverScreen').classList.add('show');
}

// ============ Local Leaderboard ============
function lbKey() {
  return 'neba_lb_' + (tgChat ? tgChat.id : 'local');
}
function saveLocalScore() {
  try {
    const key = lbKey();
    let lb = JSON.parse(localStorage.getItem(key) || '[]');
    const uid = tgUser.id || 0;
    const idx = lb.findIndex(x => x.id === uid);
    if (idx >= 0) {
      if (state.score > lb[idx].score) lb[idx].score = state.score;
      lb[idx].name = tgUser.first_name || 'لاعب';
    } else {
      lb.push({ id: uid, name: tgUser.first_name || 'لاعب', score: state.score });
    }
    lb.sort((a, b) => b.score - a.score);
    lb = lb.slice(0, 10);
    localStorage.setItem(key, JSON.stringify(lb));
  } catch(e) {}
}
function renderLeaderboard() {
  try {
    const lb = JSON.parse(localStorage.getItem(lbKey()) || '[]');
    const ul = document.getElementById('leaderboardList');
    ul.innerHTML = '';
    if (!lb.length) {
      ul.innerHTML = '<li style="justify-content:center;color:#8ba7c4;font-weight:500;">لا توجد نتائج بعد</li>';
      return;
    }
    const uid = tgUser.id || 0;
    const medals = ['🥇','🥈','🥉'];
    lb.forEach((p, i) => {
      const li = document.createElement('li');
      if (p.id === uid) li.classList.add('me');
      const rank = medals[i] || (i + 1) + '.';
      li.innerHTML = `<span><span class="rank">${rank}</span>${escapeHtml(p.name)}</span><span class="pts">${p.score}</span>`;
      ul.appendChild(li);
    });
  } catch(e) {}
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ UI Events ============
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('sendBtn').addEventListener('click', () => {
  if (!tg || !tg.sendData) {
    alert('هذه الميزة تعمل داخل تيليجرام فقط.');
    return;
  }
  const payload = JSON.stringify({
    action: 'save_score',
    score: state.score,
    level: state.level,
    name: tgUser.first_name || 'لاعب',
    user_id: tgUser.id || 0,
  });
  try { tg.sendData(payload); tg.close(); }
  catch(e) { alert('تعذر الإرسال. افتح اللعبة من داخل المجموعة.'); }
});

// Load best from storage
try {
  const storedBest = parseInt(localStorage.getItem('neba_best') || '0', 10);
  if (!isNaN(storedBest)) state.best = storedBest;
} catch(e){}
updateBestBadge();

// ============ Loop ============
let lastTime = 0;
function loop(now) {
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05; // clamp

  if (state.mode === 'playing') update(dt);

  // In menu, still animate background & bird bobbing
  if (state.mode === 'menu') {
    state.t += dt;
    for (const c of state.clouds) {
      c.x -= c.sp * dt;
      if (c.x < -140) { c.x = W + 60; c.y = 60 * SCALE + Math.random() * H * 0.35; }
    }
    for (const s of state.stars) s.tw += dt * s.sp;
    // Bird bob in menu
    if (!state.bird) {
      state.bird = {
        x: W * BIRD_X_RATIO, y: H * 0.42,
        vy: 0, r: 15 * SCALE, rot: 0, wing: 0, alive: true,
      };
    }
    const b = state.bird;
    b.y += Math.sin(state.t * 3) * 0.6;
    b.rot = Math.sin(state.t * 2) * 0.15;
    b.wing = 0.5 + 0.5 * Math.sin(state.t * 8);
  }

  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Pause audio when hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden && audioCtx) {
    try { audioCtx.suspend(); } catch(e){}
  } else if (!document.hidden && audioCtx) {
    try { audioCtx.resume(); } catch(e){}
  }
});
</script>
