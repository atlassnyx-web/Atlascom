<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>ATLAS — الطائر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0e1a; color:#e8eef5; font-family:'Cairo', Tahoma, sans-serif; touch-action:none; }
  #game { position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:none; }

  #hud {
    position:absolute; top:0; left:0; right:0;
    padding:14px 18px; pointer-events:none; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  #brand {
    font-family:'Orbitron', sans-serif;
    font-size:24px; font-weight:900;
    letter-spacing:4px; line-height:1;
    background:linear-gradient(180deg, #fff5b8 0%, #f5c518 45%, #d4a017 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 10px rgba(245,197,24,0.6));
  }
  #brand small {
    display:block; font-family:'Cairo', sans-serif;
    font-size:11px; font-weight:900; letter-spacing:8px;
    color:#7a9cc4; margin-top:4px; text-align:right;
    -webkit-text-fill-color:#7a9cc4;
  }
  #bestBadge {
    background:rgba(245,197,24,0.08);
    border:1px solid rgba(245,197,24,0.35);
    border-radius:12px; padding:6px 13px;
    text-align:center; min-width:64px;
  }
  #bestBadge .lbl { display:block; font-size:9px; color:#c8b26a; letter-spacing:1.5px; font-weight:900; }
  #bestBadge .val { display:block; font-size:20px; color:#fff; font-weight:900; font-family:'Orbitron', sans-serif; margin-top:1px; }

  .overlay {
    position:absolute; inset:0;
    display:none; flex-direction:column;
    justify-content:center; align-items:center;
    background:radial-gradient(circle at 50% 40%, rgba(14,26,43,0.9), rgba(5,10,18,0.98));
    z-index:10; padding:24px; text-align:center;
  }
  .overlay.show { display:flex; }

  .title-brand {
    font-family:'Orbitron', sans-serif;
    font-size:64px; font-weight:900; letter-spacing:8px;
    line-height:1; margin-bottom:8px;
    background:linear-gradient(180deg, #fff5b8 0%, #f5c518 50%, #d4a017 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px rgba(245,197,24,0.7));
  }
  .title-sub {
    font-family:'Cairo', sans-serif;
    font-size:16px; color:#7a9cc4; letter-spacing:12px;
    margin-bottom:40px; font-weight:900;
  }

  .btn {
    font-family:'Cairo', sans-serif;
    padding:16px 52px; font-size:19px; font-weight:900;
    background:linear-gradient(180deg, #f5c518, #d4a017);
    color:#1a1a1a; border:none; border-radius:16px;
    cursor:pointer;
    box-shadow:0 6px 0 #8b6f0f, 0 8px 24px rgba(245,197,24,0.35);
    transition:transform 0.1s, box-shadow 0.1s;
    margin:6px 0; letter-spacing:0.5px;
  }
  .btn:active {
    transform:translateY(5px);
    box-shadow:0 1px 0 #8b6f0f;
  }

  .final-title {
    font-size:28px; font-weight:900; color:#e94560;
    letter-spacing:1px; margin-bottom:10px;
    text-shadow:0 0 16px rgba(233,69,96,0.5);
  }
  .final-block {
    display:flex; gap:40px; margin:12px 0 28px;
    align-items:center; justify-content:center;
  }
  .final-block .item { text-align:center; }
  .final-block .lbl {
    font-size:11px; color:#7a9cc4; font-weight:900;
    letter-spacing:3px; margin-bottom:6px;
  }
  .final-block .val {
    font-family:'Orbitron', sans-serif;
    font-size:52px; font-weight:900; color:#f5c518;
    line-height:1; text-shadow:0 0 18px rgba(245,197,24,0.6);
  }
  .final-block .val.small {
    font-size:32px; color:#4ade80;
    text-shadow:0 0 14px rgba(74,222,128,0.5);
  }
  .new-record {
    font-size:14px; font-weight:900; color:#4ade80;
    letter-spacing:2px; margin-bottom:12px;
    animation:rec 1s ease-in-out infinite;
  }
  @keyframes rec {
    0%,100% { opacity:1; }
    50% { opacity:0.4; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="brand">ATLAS<small>الـطـائـر</small></div>
  <div id="bestBadge"><span class="lbl">أفضل</span><span class="val" id="bestVal">0</span></div>
</div>

<div class="overlay show" id="startScreen">
  <div class="title-brand">ATLAS</div>
  <div class="title-sub">الـطـائـر</div>
  <button class="btn" id="startBtn">ابدأ اللعب</button>
</div>

<div class="overlay" id="overScreen">
  <div class="final-title">انتهت اللعبة!</div>
  <div class="new-record" id="newRecord" style="display:none;">🎉 رقم قياسي جديد! 🎉</div>
  <div class="final-block">
    <div class="item"><div class="lbl">النقاط</div><div class="val" id="finalScore">0</div></div>
    <div class="item"><div class="lbl">المستوى</div><div class="val small" id="finalLevel">1</div></div>
  </div>
  <button class="btn" id="restartBtn">🔄 العب مرة أخرى</button>
</div>

<script>
// ============ Audio ============
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function tone(freq, type, dur, vol, sweepTo) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
const sfxFlap    = () => tone(480, 'sine', 0.08, 0.07, 300);
const sfxScore   = () => { tone(780, 'triangle', 0.06, 0.07); setTimeout(()=>tone(1040,'triangle',0.09,0.07), 55); };
const sfxHit     = () => { tone(200, 'triangle', 0.28, 0.1, 60); tone(130, 'sine', 0.35, 0.07, 40); };
const sfxLevelUp = () => { tone(620,'triangle',0.07,0.08); setTimeout(()=>tone(820,'triangle',0.08,0.08),65); setTimeout(()=>tone(1080,'triangle',0.12,0.08),135); };
const sfxRecord  = () => { tone(700,'sine',0.1,0.08); setTimeout(()=>tone(900,'sine',0.1,0.08),90); setTimeout(()=>tone(1200,'sine',0.1,0.08),180); setTimeout(()=>tone(1600,'sine',0.22,0.08),270); };

// ============ Canvas ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha:false });

const REF_W = 420, REF_H = 700;
const MAX_PIXELS = 700_000;  // ⚡ انخفض من 1.2M إلى 700K لأداء أعلى

let W = 0, H = 0, DPR = 1, scale = 1;
let playLeft = 0, playRight = 0, playW = 0;

// ⚡ كل الصور المخزنة مسبقاً
let bgCache = null;
let sunCache = null;
let birdCache = null;      // الطائر كامل بدون دوران
let wingCache = null;      // الجنح
let pipeBodyCache = null;  // جسم الأنبوب
let pipeCapCache = null;   // كاب الأنبوب

function computeLayout() {
  let dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  if (W * H * dpr * dpr > MAX_PIXELS) dpr = Math.sqrt(MAX_PIXELS / (W * H));
  dpr = Math.max(0.65, dpr);
  DPR = dpr;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = H / REF_H;
  const idealW = REF_W * scale;
  if (W > idealW) { playW = idealW; playLeft = (W - idealW) / 2; playRight = playLeft + idealW; }
  else { playLeft = 0; playW = W; playRight = W; }
  buildAllCaches();
  if (state.bird) repositionBird();
}

// ==================== Pre-render كل شي مرة وحدة ====================
function buildAllCaches() {
  buildBackground();
  buildSun();
  buildBird();
  buildWing();
  buildPipe();
}

function buildBackground() {
  bgCache = document.createElement('canvas');
  bgCache.width = canvas.width; bgCache.height = canvas.height;
  const b = bgCache.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Sky gradient (this one is fine, only done once)
  const sky = b.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0.00, '#080b1a');
  sky.addColorStop(0.35, '#0f1a35');
  sky.addColorStop(0.60, '#1e2a52');
  sky.addColorStop(0.80, '#3d3a6b');
  sky.addColorStop(0.92, '#a5577c');
  sky.addColorStop(1.00, '#f5a15f');
  b.fillStyle = sky;
  b.fillRect(0, 0, W, H);
  // Stars
  b.fillStyle = '#fff';
  for (let i = 0; i < 45; i++) {
    const a = 0.25 + Math.random() * 0.55;
    b.globalAlpha = a;
    const r = Math.random() * 1.5 + 0.3;
    b.beginPath();
    b.arc(Math.random() * W, Math.random() * H * 0.55, r, 0, Math.PI * 2);
    b.fill();
  }
  b.globalAlpha = 1;
  // Side vignettes
  if (playLeft > 4) {
    const lg = b.createLinearGradient(0, 0, playLeft, 0);
    lg.addColorStop(0, 'rgba(0,0,0,0.6)');
    lg.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = lg; b.fillRect(0, 0, playLeft, H);
    const rg = b.createLinearGradient(W, 0, playRight, 0);
    rg.addColorStop(0, 'rgba(0,0,0,0.6)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = rg; b.fillRect(playRight, 0, W - playRight, H);
  }
}

function buildSun() {
  const ss = 256;
  sunCache = document.createElement('canvas');
  sunCache.width = ss; sunCache.height = ss;
  const g = sunCache.getContext('2d');
  const grad = g.createRadialGradient(ss/2, ss/2, 5, ss/2, ss/2, ss/2);
  grad.addColorStop(0,    'rgba(255,245,210,1)');
  grad.addColorStop(0.15, 'rgba(255,220,150,0.9)');
  grad.addColorStop(0.4,  'rgba(255,180,110,0.4)');
  grad.addColorStop(0.75, 'rgba(255,140,80,0.1)');
  grad.addColorStop(1,    'rgba(255,140,80,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, ss, ss);
}

// ⚡ الطائر كامل بدون دوران - نخزن كل شي بكانفس صغير
function buildBird() {
  const R = 40;  // half-size
  const s = 80;  // full size in logical units
  birdCache = document.createElement('canvas');
  birdCache.width = s * 2; birdCache.height = s * 2;
  const c = birdCache.getContext('2d');
  c.translate(s, s);
  const r = R;
  
  // Body (radial gradient)
  const bg = c.createRadialGradient(-r*0.25, -r*0.3, r*0.15, 0, 0, r);
  bg.addColorStop(0, '#fff9d6');
  bg.addColorStop(0.5, '#f5c518');
  bg.addColorStop(1, '#b8860b');
  c.fillStyle = bg;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
  
  // Belly highlight
  c.fillStyle = 'rgba(255,250,220,0.75)';
  c.beginPath(); c.ellipse(-r*0.1, -r*0.3, r*0.55, r*0.4, -0.3, 0, Math.PI*2); c.fill();
  
  // Bottom shading
  c.fillStyle = 'rgba(139,92,0,0.4)';
  c.beginPath(); c.ellipse(0, r*0.55, r*0.7, r*0.3, 0, 0, Math.PI*2); c.fill();
  
  // Eye white
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(r*0.42, -r*0.32, r*0.34, 0, Math.PI*2); c.fill();
  
  // Iris
  c.fillStyle = '#000';
  c.beginPath(); c.arc(r*0.52, -r*0.32, r*0.16, 0, Math.PI*2); c.fill();
  
  // Eye shine
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(r*0.58, -r*0.4, r*0.06, 0, Math.PI*2); c.fill();
  
  // Cheek blush
  c.fillStyle = 'rgba(255,120,120,0.35)';
  c.beginPath(); c.arc(r*0.15, r*0.15, r*0.16, 0, Math.PI*2); c.fill();
  
  // Beak
  c.fillStyle = '#ff8c00';
  c.beginPath();
  c.moveTo(r*0.85, -r*0.08);
  c.lineTo(r*1.45, r*0.05);
  c.lineTo(r*0.85, r*0.22);
  c.closePath(); c.fill();
  c.strokeStyle = '#b35a00'; c.lineWidth = 1.2; c.stroke();
  // Beak highlight
  c.fillStyle = 'rgba(255,220,150,0.6)';
  c.beginPath();
  c.moveTo(r*0.9, -r*0.04);
  c.lineTo(r*1.4, r*0.03);
  c.lineTo(r*0.9, r*0.06);
  c.closePath(); c.fill();
  
  // نرجع القياسات للحساب
  birdCache._w = s * 2;
  birdCache._r = r;
  birdCache._center = s;
}

function buildWing() {
  const R = 40;
  const s = 70;
  wingCache = document.createElement('canvas');
  wingCache.width = s * 2; wingCache.height = s * 2;
  const c = wingCache.getContext('2d');
  c.translate(s, s);
  const r = R;
  const wg = c.createLinearGradient(0, 0, -r*1.1, r*0.5);
  wg.addColorStop(0, '#f5c518');
  wg.addColorStop(1, '#a87600');
  c.fillStyle = wg;
  c.beginPath(); c.ellipse(-r*0.55, 0, r*0.8, r*0.42, 0, 0, Math.PI*2); c.fill();
  c.strokeStyle = 'rgba(120,80,0,0.7)'; c.lineWidth = 1.2; c.stroke();
  c.strokeStyle = 'rgba(120,80,0,0.5)'; c.lineWidth = 0.8;
  for (let i = 0; i < 3; i++) {
    c.beginPath();
    c.moveTo(-r*0.4 - i*r*0.2, -r*0.15);
    c.lineTo(-r*0.4 - i*r*0.2, r*0.15);
    c.stroke();
  }
  wingCache._w = s * 2;
  wingCache._center = s;
}

// ⚡ الأنابيب: نخزن قس الطوب (body) و الكاب (cap) مرتين فقط
function buildPipe() {
  // Body tile: 68px wide × 40px tall (stretched vertically)
  const pw = 68, ph = 40;
  pipeBodyCache = document.createElement('canvas');
  pipeBodyCache.width = pw; pipeBodyCache.height = ph;
  const bc = pipeBodyCache.getContext('2d');
  // Body color (solid, no gradient)
  bc.fillStyle = '#2e7d32';
  bc.fillRect(0, 0, pw, ph);
  // Dark left strip
  bc.fillStyle = '#1a4d1e';
  bc.fillRect(0, 0, pw * 0.25, ph);
  // Light right strip
  bc.fillStyle = '#4caf50';
  bc.fillRect(pw * 0.62, 0, pw * 0.14, ph);
  
  // Cap: 80px wide (68 + 6*2) × 26 tall
  const cw = 80, ch = 26;
  pipeCapCache = document.createElement('canvas');
  pipeCapCache.width = cw; pipeCapCache.height = ch;
  const cc = pipeCapCache.getContext('2d');
  cc.fillStyle = '#2e7d32';
  cc.fillRect(0, 0, cw, ch);
  cc.fillStyle = '#1a4d1e';
  cc.fillRect(0, 0, cw * 0.22, ch);
  cc.fillStyle = '#8bc34a';
  cc.fillRect(0, 3, cw, 2);
  cc.strokeStyle = '#4caf50';
  cc.lineWidth = 1.5;
  cc.strokeRect(0.75, 0.75, cw - 1.5, ch - 1.5);
  
  pipeBodyCache._pw = pw;
  pipeCapCache._cw = cw;
  pipeCapCache._ch = ch;
}

window.addEventListener('resize', computeLayout);

// ============ Constants ============
const GRAVITY    = 1000;
const FLAP_VY    = -410;
const MAX_FALL   = 700;
const BASE_SPEED = 235;
const MAX_SPEED  = 380;
const PIPE_W     = 68;
const PIPE_CAP_H = 26;
const BASE_GAP   = 205;
const MIN_GAP    = 148;
const GROUND_H   = 88;
const BIRD_X_FRAC = 0.30;
const BASE_INTERVAL = 1.35;
const MIN_INTERVAL  = 0.95;

// ============ State ============
const state = {
  mode: 'menu',
  score: 0, level: 1, best: 0, t: 0,
  bird: null, pipes: [], particles: [],
  groundOffset: 0, spawnTimer: 0,
  shake: 0, hitFlash: 0, levelFlash: 0, scorePop: 0,
};

function repositionBird() {
  if (!state.bird) return;
  state.bird.x = playLeft + playW * BIRD_X_FRAC;
  state.bird.r = 16 * scale;
}

function resetGame() {
  state.mode = 'playing';
  state.score = 0; state.level = 1; state.t = 0;
  state.pipes.length = 0; state.particles.length = 0;
  state.groundOffset = 0; state.spawnTimer = 0.8;
  state.shake = 0; state.hitFlash = 0; state.levelFlash = 0; state.scorePop = 0;
  state.bird = {
    x: playLeft + playW * BIRD_X_FRAC,
    y: H * 0.42, vy: 0, r: 16 * scale,
    rot: 0, wing: 0, alive: true,
  };
}

// ============ Input ============
function flap() {
  if (state.mode === 'menu') { startGame(); return; }
  if (state.mode !== 'playing' || !state.bird) return;
  state.bird.vy = FLAP_VY * scale;
  state.bird.wing = 1;
  sfxFlap();
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); if (state.mode === 'playing') flap(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});
document.addEventListener('contextmenu', e => e.preventDefault());

// ============ Pipes ============
function spawnPipe() {
  const gapH = Math.max(MIN_GAP * scale, (BASE_GAP - (state.level - 1) * 6) * scale);
  const margin = 50 * scale;
  const minY = margin + gapH / 2;
  const maxY = H - GROUND_H * scale - margin - gapH / 2;
  const gapY = minY + Math.random() * Math.max(1, (maxY - minY));
  state.pipes.push({ x: W + PIPE_W * scale, gapY, gapH, passed: false });
}

// ============ Particles (simple, limited) ============
const MAX_PARTICLES = 25;
function spawnBurst(x, y, color, count) {
  for (let i = 0; i < count && state.particles.length < MAX_PARTICLES; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 100;
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 40,
      life: 0.5,
      color,
      size: 2 + Math.random() * 2,
    });
  }
}

// ============ Update ============
function update(dt) {
  if (state.mode !== 'playing') return;
  state.t += dt;

  state.level = Math.floor(state.score / 5) + 1;
  const speed = Math.min(MAX_SPEED, BASE_SPEED + (state.level - 1) * 12) * scale;
  const interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - (state.level - 1) * 0.06);

  const b = state.bird;
  b.vy += GRAVITY * scale * dt;
  if (b.vy > MAX_FALL * scale) b.vy = MAX_FALL * scale;
  b.y += b.vy * dt;

  const targetRot = Math.max(-0.5, Math.min(1.2, b.vy / (700 * scale)));
  b.rot += (targetRot - b.rot) * Math.min(1, dt * 10);
  if (b.wing > 0) b.wing = Math.max(0, b.wing - dt * 3.5);

  if (b.y - b.r < 0) { b.y = b.r; b.vy = 0; }

  const gy = H - GROUND_H * scale;
  if (b.y + b.r >= gy) { b.y = gy - b.r; gameOver(); return; }

  state.groundOffset += speed * dt;
  if (state.groundOffset > 60 * scale) state.groundOffset -= 60 * scale;

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) { state.spawnTimer = interval; spawnPipe(); }

  const pipeW = PIPE_W * scale;
  for (let i = state.pipes.length - 1; i >= 0; i--) {
    const p = state.pipes[i];
    p.x -= speed * dt;
    if (p.x + pipeW < -10) { state.pipes.splice(i, 1); continue; }

    const bx1 = b.x - b.r * 0.82, bx2 = b.x + b.r * 0.82;
    const by1 = b.y - b.r * 0.82, by2 = b.y + b.r * 0.82;
    const pL = p.x, pR = p.x + pipeW;
    const pTopB = p.gapY - p.gapH / 2;
    const pBotT = p.gapY + p.gapH / 2;

    if (bx2 > pL && bx1 < pR) {
      if (by1 < pTopB) { gameOver(); return; }
      if (by2 > pBotT) { gameOver(); return; }
    }

    if (!p.passed && pR < b.x - b.r) {
      p.passed = true;
      state.score++;
      state.scorePop = 0.35;
      sfxScore();
      if (state.score % 5 === 0) {
        state.levelFlash = 1.4;
        sfxLevelUp();
      }
    }
  }

  // Particles (simple update)
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 350 * dt;
    p.vx *= 0.96;
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 50);
  if (state.hitFlash > 0) state.hitFlash -= dt;
  if (state.levelFlash > 0) state.levelFlash -= dt;
  if (state.scorePop > 0) state.scorePop -= dt;
}

// ============ Render ============
function render() {
  const shX = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;
  const shY = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;

  // Background
  if (bgCache) ctx.drawImage(bgCache, 0, 0, W, H);

  // Sun (fast drawImage, no composite op)
  if (sunCache) {
    const sunSize = 240 * scale;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(sunCache, W * 0.78 - sunSize, H * 0.62 - sunSize, sunSize * 2, sunSize * 2);
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(shX, shY);

  // Hills (solid color)
  drawHills();
  // Pipes (uses cached sprites)
  for (let i = 0; i < state.pipes.length; i++) drawPipe(state.pipes[i]);
  // Ground
  drawGround();
  // Bird (uses cached sprite)
  if (state.bird) drawBird(state.bird);
  // Particles
  for (let i = 0; i < state.particles.length; i++) {
    const p = state.particles[i];
    ctx.globalAlpha = Math.max(0, p.life / 0.5);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // Score
  if (state.mode === 'playing') {
    const pop = state.scorePop > 0 ? 1 + state.scorePop * 0.6 : 1;
    ctx.save();
    ctx.translate(W / 2, 118 * scale);
    ctx.scale(pop, pop);
    ctx.font = `900 ${62 * scale}px "Orbitron", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(state.score, 3, 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(state.score, 0, 0);
    ctx.restore();
  }

  if (state.hitFlash > 0) {
    ctx.fillStyle = `rgba(233,69,96,${(state.hitFlash / 0.4) * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state.levelFlash > 0) {
    const a = state.levelFlash / 1.4;
    ctx.fillStyle = `rgba(74,222,128,${a * 0.15})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = a;
    ctx.font = `900 ${40 * scale}px "Orbitron", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#4ade80';
    ctx.fillText(`LV ${state.level}`, W / 2, H * 0.28);
    ctx.globalAlpha = 1;
  }

  if (state.mode === 'menu') {
    const pulse = 0.5 + 0.5 * Math.sin(state.t * 2.4);
    ctx.globalAlpha = 0.5 + pulse * 0.4;
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${14 * scale}px "Cairo", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('اضغط لتبدأ', W / 2, H - GROUND_H * scale - 44 * scale);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ============ Drawing (all cached) ============
function drawHills() {
  const baseY = H - GROUND_H * scale + 6 * scale;
  ctx.fillStyle = '#1e3352';
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  const step = W / 6;
  const off = (state.groundOffset * 0.004) % 2;
  for (let i = 0; i <= 6; i++) {
    const h = 45 * scale + Math.sin((i + off) * 1.7) * 30 * scale;
    ctx.lineTo(i * step, baseY - h);
  }
  ctx.lineTo(W, baseY);
  ctx.closePath();
  ctx.fill();
}

function drawGround() {
  const gy = H - GROUND_H * scale;
  ctx.fillStyle = '#3d2f20';
  ctx.fillRect(0, gy, W, GROUND_H * scale);
  ctx.fillStyle = '#c8a86b';
  ctx.fillRect(0, gy, W, 5 * scale);
  ctx.fillStyle = '#8a7043';
  ctx.fillRect(0, gy + 5 * scale, W, 3 * scale);
  const sw = 34 * scale;
  const off = state.groundOffset % sw;
  ctx.fillStyle = 'rgba(200,168,107,0.15)';
  for (let x = -sw + off; x < W; x += sw) {
    ctx.fillRect(x, gy + 14 * scale, 3 * scale, GROUND_H * scale - 14 * scale);
  }
  ctx.fillStyle = 'rgba(245,197,24,0.45)';
  ctx.fillRect(0, gy - 1, W, 1);
}

function drawPipe(p) {
  const pw = PIPE_W * scale;
  const capH = PIPE_CAP_H * scale;
  const oh = 6 * scale;
  const pTopB = p.gapY - p.gapH / 2;
  const pBotT = p.gapY + p.gapH / 2;

  // Top pipe body - drawImage (sprite) instead of gradient
  if (pipeBodyCache) {
    const bodyH = pTopB - capH;
    if (bodyH > 0) {
      ctx.drawImage(pipeBodyCache, p.x, 0, pw, bodyH);
    }
  }
  // Top cap
  if (pipeCapCache) {
    ctx.drawImage(pipeCapCache, p.x - oh, pTopB - capH, pw + oh * 2, capH);
  }
  // Bottom cap
  if (pipeCapCache) {
    ctx.drawImage(pipeCapCache, p.x - oh, pBotT, pw + oh * 2, capH);
  }
  // Bottom pipe body
  const botY = pBotT + capH;
  const botH = H - GROUND_H * scale - botY;
  if (botH > 0 && pipeBodyCache) {
    ctx.drawImage(pipeBodyCache, p.x, botY, pw, botH);
  }
}

function drawBird(b) {
  const r = b.r;
  // Shadow
  const gy = H - GROUND_H * scale;
  const dist = Math.max(0, gy - b.y);
  const maxDist = H * 0.7;
  const shadowA = Math.max(0, 0.3 * (1 - dist / maxDist));
  if (shadowA > 0.03) {
    ctx.globalAlpha = shadowA;
    ctx.fillStyle = '#000';
    const s = Math.max(0.4, 1 - dist / maxDist * 0.6);
    ctx.beginPath();
    ctx.ellipse(b.x + 3, gy + 4, r * 1.05 * s, r * 0.4 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Draw bird sprite (rotate)
  if (birdCache && birdCache._r) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    // في الكانفس المخزن، r يساوي 40px. المطلوب r الحالي. النسبة:
    const spriteScale = (r / 40) * (40 / 40);
    // لكن الكانفس المخزن حجمه 160×160 والطائر مركزه بـ 80، ونصف قطره 40
    // نريد رسمه بحيث يكون نصف قطره = r الحالي
    const drawSize = (r * 2) * (160 / 80);  // = r*4
    ctx.drawImage(birdCache, -drawSize/2, -drawSize/2, drawSize, drawSize);
    // الجنح
    if (wingCache) {
      const wingAngle = -0.5 + b.wing * 1.3;
      ctx.save();
      ctx.translate(-r * 0.15, r * 0.05);
      ctx.rotate(wingAngle);
      const wingDrawSize = (r * 2) * (140 / 70); // r*4
      ctx.drawImage(wingCache, -wingDrawSize/2, -wingDrawSize/2, wingDrawSize, wingDrawSize);
      ctx.restore();
    }
    ctx.restore();
  }
}

// ============ Flow ============
function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch(e){} }
  document.getElementById('startScreen').classList.remove('show');
  document.getElementById('overScreen').classList.remove('show');
  resetGame();
  state.bird.vy = FLAP_VY * scale * 0.5;
  sfxFlap();
}

function gameOver() {
  state.mode = 'over';
  state.shake = 16 * scale;
  state.hitFlash = 0.4;
  sfxHit();

  const isNewRecord = state.score > state.best;
  if (isNewRecord) {
    state.best = state.score;
    try { localStorage.setItem('atlas_best', String(state.best)); } catch(e){}
    sfxRecord();
  }
  updateBestBadge();
  document.getElementById('finalScore').textContent = state.score;
  document.getElementById('finalLevel').textContent = state.level;
  document.getElementById('newRecord').style.display = isNewRecord ? 'block' : 'none';
  document.getElementById('overScreen').classList.add('show');
}

function updateBestBadge() {
  document.getElementById('bestVal').textContent = state.best;
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

try {
  const sb = parseInt(localStorage.getItem('atlas_best') || '0', 10);
  if (!isNaN(sb)) state.best = sb;
} catch(e){}
updateBestBadge();

computeLayout();

// Warmup
(function warmup() {
  const tb = { x: -200, y: -200, r: 16 * scale, rot: 0, wing: 0.5 };
  state.bird = tb;
  for (let i = 0; i < 3; i++) render();
  state.bird = null;
})();

// ============ Loop ============
let lastTime = 0, lastRender = 0;
const FRAME_MS = 16; // ~60 FPS
function loop(now) {
  requestAnimationFrame(loop);
  if (now - lastRender < FRAME_MS) return;
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now; lastRender = now;
  if (dt > 0.05) dt = 0.05;

  if (state.mode === 'playing') {
    update(dt);
  } else if (state.mode === 'menu') {
    state.t += dt;
    if (!state.bird) state.bird = {
      x: playLeft + playW * BIRD_X_FRAC, y: H * 0.42,
      vy: 0, r: 16 * scale, rot: 0, wing: 0.5, alive: true,
    };
    const b = state.bird;
    b.y = H * 0.42 + Math.sin(state.t * 2.6) * 6 * scale;
    b.rot = Math.sin(state.t * 1.8) * 0.12;
    b.wing = 0.5 + 0.5 * Math.sin(state.t * 7);
  }

  render();
}
requestAnimationFrame(loop);

document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  if (document.hidden) { try { audioCtx.suspend(); } catch(e){} }
  else { try { audioCtx.resume(); } catch(e){} }
});
</script>
